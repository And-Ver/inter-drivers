<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inter Οδηγοί</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --green-dark:#1a3a1a;--green-mid:#3B6D11;--green-light:#7dc54a;--green-bg:#EAF3DE;
  --border:#d0e4b8;--bg:#f4f9ee;--card:#fff;--text:#1a2e1a;--text2:#5a7a5a;--text3:#8aaa8a;
  --orange:#EF9F27;--orange-bg:#FEF3E2;--red:#c04040;--red-bg:#FCEBEB;
  --radius:12px;--shadow:0 1px 4px rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:20px}
.header{background:var(--green-dark);color:#a8d878;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header-title{font-size:17px;font-weight:700;letter-spacing:.01em}
.header-right{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.8}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#8aaa8a;transition:background .3s}
.sync-dot.ok{background:#7dc54a}.sync-dot.syncing{background:#EF9F27;animation:pulse 1s infinite}.sync-dot.error{background:#e05555}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.nav-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:49px;z-index:40}
.tab{flex:1;padding:11px 0;text-align:center;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--green-mid);border-bottom-color:var(--green-mid)}
.tab i{display:block;font-size:18px;margin-bottom:2px}

.page{display:none;padding:14px 14px 0}
.page.active{display:block}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.label i{font-size:14px}

/* Day buttons */
.day-btns{display:flex;gap:8px;margin-bottom:12px}
.day-btn{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;transition:all .15s}
.day-btn.active{background:var(--green-dark);border-color:var(--green-dark);color:#a8d878}
.day-btn-main{font-size:13px;font-weight:600}
.day-btn-sub{font-size:11px;opacity:.7;margin-top:2px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border)}
.chip-work{background:var(--green-bg);border-color:#97C459;color:var(--green-mid)}
.chip-off{background:#f5f5f5;border-color:#ddd;color:#999;text-decoration:line-through}
.chip-adeia{background:#FEF3E2;border-color:#EF9F27;color:#854F0B}
.chip-holiday{background:#FEF3E2;border-color:#EF9F27;color:#854F0B}
.chip-sun{background:#F1EFE8;border-color:#B4B2A9;color:#5F5E5A}

/* Alert */
.msg{font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:10px;border:.5px solid}
.msg-hol{background:var(--orange-bg);border-color:var(--orange);color:#854F0B}
.msg-sun{background:#F1EFE8;border-color:#B4B2A9;color:#5F5E5A}

/* Count selector */
.count-row{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.cnt-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:300;transition:all .12s;user-select:none}
.cnt-btn:active{background:var(--border)}
.cnt-num{font-size:36px;font-weight:700;color:var(--green-mid);min-width:40px;text-align:center;line-height:1}
.cnt-label{font-size:13px;color:var(--text2)}

/* Send area */
.send-card{background:var(--green-bg);border-color:#97C459}
.suggested-names{margin-bottom:12px}
.sent-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid #c8e0a8}
.sent-row:last-child{border-bottom:none}
.sent-name{font-size:16px;font-weight:600;color:var(--green-dark)}
.sent-meta{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px}
.sent-actions{display:flex;gap:8px}
.ic-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:4px;opacity:.6;transition:opacity .15s}
.ic-btn:hover{opacity:1}
.ic-btn.del{color:var(--red)}
.ic-btn.edit{color:var(--green-mid)}
select.inline-sel{font-size:14px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);margin-right:6px}
.ok-btn{font-size:12px;padding:5px 10px;border:none;border-radius:6px;background:var(--green-dark);color:#a8d878;cursor:pointer;font-weight:700}

.send-btn{width:100%;padding:14px;background:var(--green-dark);color:#a8d878;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .12s}
.send-btn:active{opacity:.85;transform:scale(.98)}
.send-btn.has-entry{background:var(--green-bg);color:var(--green-mid);border:1px solid #97C459}

/* Stats */
.stat-row{padding:8px 0;border-bottom:.5px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.stat-name{font-size:14px;font-weight:500}
.stat-cnt{font-size:14px;color:var(--text2)}
.stat-last{font-size:12px;color:var(--text3);margin-bottom:3px}
.score-bar{height:5px;border-radius:3px;background:var(--border)}
.score-fill{height:100%;border-radius:3px;background:var(--green-mid)}
.next-badge{font-size:11px;background:var(--green-bg);color:var(--green-mid);border:.5px solid #97C459;border-radius:10px;padding:2px 7px;margin-left:6px}

/* History */
.hist-row{font-size:13px;padding:8px 0;border-bottom:.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.hist-row:last-child{border-bottom:none}
.hist-date{color:var(--text2);min-width:50px}
.hist-names{color:var(--text);font-weight:500;text-align:right}

.empty{color:var(--text3);font-size:14px;padding:20px;text-align:center}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--text2);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--green-mid);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Schedule editor */
.sched-driver{margin-bottom:14px}
.sched-driver-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.sched-days{display:flex;flex-wrap:wrap;gap:4px}
.sched-day{width:34px;height:34px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;color:var(--text2);padding:0;-webkit-appearance:none;touch-action:manipulation}
.sched-day.sun{background:#F1EFE8;border-color:#B4B2A9;color:#bbb;cursor:default}
.sched-day.repo{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.sched-day.adeia{background:#E3F4FC;border-color:#00B0F0;color:#0077AA}
.sched-day.working{background:var(--green-bg);border-color:#97C459;color:var(--green-mid)}
.sched-legend{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sched-leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.sched-leg-dot{width:12px;height:12px;border-radius:3px;border:1px solid}
.sched-save-btn{width:100%;padding:14px;background:var(--green-dark);color:#a8d878;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.sched-save-btn:active{opacity:.85}
</style>
</head>
<body>
<div class="header">
  <div class="header-title"><i class="ti ti-truck"></i> Inter Οδηγοί</div>
  <div class="header-right">
    <span id="hdr-date"></span>
    <div class="sync-dot" id="sync-dot"></div>
  </div>
</div>

<div class="nav-tabs">
  <div class="tab active" onclick="showPage('main')"><i class="ti ti-send"></i>Αποστολή</div>
  <div class="tab" onclick="showPage('stats')"><i class="ti ti-chart-bar"></i>Στατιστικά</div>
  <div class="tab" onclick="showPage('history')"><i class="ti ti-clock"></i>Ιστορικό</div>
  <div class="tab" onclick="showPage('schedule')"><i class="ti ti-settings"></i>Πρόγραμμα</div>
</div>

<div id="page-main" class="page active">
  <div class="card">
    <div class="label"><i class="ti ti-calendar"></i> Επιλογή ημέρας</div>
    <div class="day-btns" id="day-btns"></div>
    <div class="chips" id="driver-chips"></div>
  </div>
  <div id="action-card"></div>
</div>

<div id="page-stats" class="page">
  <div class="card">
    <div class="label"><i class="ti ti-building-factory"></i> Κατάταξη Inter</div>
    <div id="stats-list"><div class="loading"><div class="spinner"></div>Φόρτωση...</div></div>
  </div>
</div>

<div id="page-history" class="page">
  <div class="card">
    <div class="label"><i class="ti ti-history"></i> Ιστορικό αποστολών</div>
    <div id="history-list"><div class="loading"><div class="spinner"></div>Φόρτωση...</div></div>
  </div>
</div>

<div id="page-schedule" class="page">
  <div class="card">
    <div class="label"><i class="ti ti-settings"></i> Επεξεργασία προγράμματος μήνα</div>
    <div class="sched-legend">
      <div class="sched-leg-item"><div class="sched-leg-dot" style="background:var(--green-bg);border-color:#97C459"></div>Εργασία</div>
      <div class="sched-leg-item"><div class="sched-leg-dot" style="background:var(--red-bg);border-color:var(--red)"></div>Ρεπό</div>
      <div class="sched-leg-item"><div class="sched-leg-dot" style="background:#E3F4FC;border-color:#00B0F0"></div>Άδεια</div>
      <div class="sched-leg-item"><div class="sched-leg-dot" style="background:#F1EFE8;border-color:#B4B2A9"></div>Κυριακή</div>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:12px">Πάτα σε μια μέρα για να αλλάξεις κατάσταση: Εργασία → Ρεπό → Άδεια</div>
    <div id="sched-editor"></div>
    <button class="sched-save-btn" onclick="saveSchedule()"><i class="ti ti-device-floppy"></i> Αποθήκευση αλλαγών</button>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const BACKEND='https://script.google.com/macros/s/AKfycbzio_Ywf9wfnnZU7a2kbTWAKemo4nTubBlIFBmmwx7BY8E7dfCIJzuc5SApiiLGYZ6k/exec';
const DRIVERS=['Καραγιώργος','Σαντικίδης','Σερσέμης','Στύλος','Ζαχαρίας'];
const WD=['Κυρ','Δευ','Τρι','Τετ','Πεμ','Παρ','Σαβ'];

// Μάιος 2026 — ημέρες που ΔΕΝ εργάζεται (εκτός Κυριακών/αργιών)
const MAY_SCHED={
  'Καραγιώργος':{repos:[9,18,23,29],   adeia:[4,5,6,7,8]},
  'Σαντικίδης': {repos:[16,22,28],      adeia:[]},
  'Σερσέμης':   {repos:[2,15,21,27],    adeia:[]},
  'Στύλος':     {repos:[11,20,26],      adeia:[12,13]},
  'Ζαχαρίας':  {repos:[14,19,25,30],   adeia:[]}
};
const MAY_HOL=[1];
const MAY_SUN=[3,10,17,24,31];

const HISTORICAL=[
  {date:'2026-04-22',drivers:['Σερσέμης','Ζαχαρίας']},
  {date:'2026-04-23',drivers:['Καραγιώργος','Στύλος']},
  {date:'2026-04-24',drivers:['Σερσέμης','Στύλος','Ζαχαρίας']},
  {date:'2026-04-27',drivers:['Καραγιώργος','Σερσέμης','Ζαχαρίας']},
  {date:'2026-04-28',drivers:['Σαντικίδης','Σερσέμης','Στύλος']},
  {date:'2026-04-29',drivers:['Σαντικίδης','Σερσέμης','Ζαχαρίας']},
  {date:'2026-04-30',drivers:['Καραγιώργος','Στύλος']},
  {date:'2026-05-04',drivers:['Σαντικίδης','Ζαχαρίας']},
  {date:'2026-05-05',drivers:['Στύλος','Σερσέμης']},
  {date:'2026-05-06',drivers:['Σαντικίδης','Σερσέμης']},
  {date:'2026-05-07',drivers:['Στύλος','Ζαχαρίας']},
  {date:'2026-05-08',drivers:['Σαντικίδης','Σερσέμης','Στύλος']},
  {date:'2026-05-11',drivers:['Καραγιώργος','Ζαχαρίας']},
  {date:'2026-05-12',drivers:['Σαντικίδης','Σερσέμης']},
  {date:'2026-05-13',drivers:['Καραγιώργος','Ζαχαρίας','Σαντικίδης']},
  {date:'2026-05-14',drivers:['Σερσέμης','Στύλος']},
  {date:'2026-05-15',drivers:['Καραγιώργος','Σαντικίδης']},
  {date:'2026-05-16',drivers:['Σερσέμης','Ζαχαρίας','Στύλος']},
  {date:'2026-05-18',drivers:['Σαντικίδης','Στύλος']},
  {date:'2026-05-19',drivers:['Καραγιώργος','Σερσέμης','Σαντικίδης']},
  {date:'2026-05-20',drivers:['Ζαχαρίας']},
  {date:'2026-05-21',drivers:['Καραγιώργος','Στύλος']},
];

// ============================================================
// STATE
// ============================================================
let S={history:[],counts:{},monthCounts:{},lastDate:{},selOffset:1,currentCount:0,editIdx:-1,editVal:''};
let dayOpts=[];
const CURRENT_MONTH=new Date().toISOString().slice(0,7);

// Custom schedule overrides (αποθηκεύονται στο Sheet)
// Format: {year:{month:{driver:{repos:[],adeia:[]}}}}
let customSched={};

// ============================================================
// HELPERS
// ============================================================
function dateStr(off){const d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)}
function parseDate(s){return new Date(s+'T12:00:00')}
function fmtDate(s){const d=parseDate(s);return `${d.getDate()}/${d.getMonth()+1}`}
function daysSince(ds){if(!ds)return null;const diff=Math.floor((new Date()-parseDate(ds))/(1000*60*60*24));return diff}

function getStatus(ds){
  const d=parseDate(ds);
  const day=d.getDate(),month=d.getMonth()+1,year=d.getFullYear();
  const isSun=d.getDay()===0;
  const working=[],repos=[],adeia=[],holiday=[],sunday=[];

  // Βρες το σωστό schedule (custom override ή built-in)
  const builtinSched = month===5&&year===2026 ? MAY_SCHED : null;
  const builtinHol   = month===5&&year===2026 ? MAY_HOL : [];
  const isHol = builtinHol.includes(day);

  DRIVERS.forEach(dr=>{
    if(isSun){sunday.push(dr);return}
    if(isHol){holiday.push(dr);return}
    // Έλεγξε custom override πρώτα
    const custom=(customSched[year]||{})[month]||({})[dr];
    const custDr=(((customSched[year]||{})[month])||{})[dr];
    if(custDr){
      if(custDr.adeia&&custDr.adeia.includes(day))adeia.push(dr);
      else if(custDr.repos&&custDr.repos.includes(day))repos.push(dr);
      else working.push(dr);
    } else if(builtinSched&&builtinSched[dr]){
      const sc=builtinSched[dr];
      if(sc.adeia.includes(day))adeia.push(dr);
      else if(sc.repos.includes(day))repos.push(dr);
      else working.push(dr);
    } else {
      working.push(dr);
    }
  });
  return{working,repos,adeia,holiday,sunday};
}

function getDayOpts(){
  const opts=[];let off=0;
  while(opts.length<3){
    const ds=dateStr(off);
    opts.push({offset:off,dateStr:ds,weekday:parseDate(ds).getDay(),status:getStatus(ds)});
    off++;
  }
  return opts;
}

function getPrevWorkingDate(ds){
  // Βρες την προηγούμενη εργάσιμη ημέρα από το ds
  const d=parseDate(ds);
  for(let i=1;i<=7;i++){
    const prev=new Date(d);prev.setDate(d.getDate()-i);
    const ps=prev.toISOString().slice(0,10);
    const pd=parseDate(ps);
    const day=pd.getDate(),month=pd.getMonth();
    if(month!==4) return ps; // εκτός Μαΐου, επιστρέφουμε ό,τι βρούμε
    if(MAY_SUN.includes(day)||MAY_HOL.includes(day)) continue; // παρακάμπτουμε
    return ps;
  }
  return null;
}

function getSorted(available, forDateStr){
  // forDateStr: η ημερομηνία για την οποία επιλέγουμε
  // Κριτήρια: 1) λιγότερες φορές, 2) δεν πήγε την προηγούμενη εργάσιμη, 3) παλαιότερη τελευταία
  const prevDs = forDateStr ? getPrevWorkingDate(forDateStr) : null;
  const prevEntry = prevDs ? getEntry(prevDs) : null;
  const wentYesterday = prevEntry ? prevEntry.drivers : [];

  // Χωρισμός: αυτοί που δεν πήγαν χθες και αυτοί που πήγαν
  const fresh = available.filter(d=>!wentYesterday.includes(d));
  const repeated = available.filter(d=>wentYesterday.includes(d));

  function byRotation(list){
    return [...list].sort((a,b)=>{
      const ca=S.counts[a]||0,cb=S.counts[b]||0;
      if(ca!==cb)return ca-cb;
      const la=S.lastDate[a]||'1900-01-01',lb=S.lastDate[b]||'1900-01-01';
      return la.localeCompare(lb);
    });
  }

  // Πρώτα οι "φρέσκοι" ταξινομημένοι, μετά οι "χθεσινοί" ταξινομημένοι
  return [...byRotation(fresh), ...byRotation(repeated)];
}

function getEntry(ds){return S.history.find(h=>h.date===ds)||null}

function rebuildCounts(){
  S.counts={};S.monthCounts={};S.lastDate={};
  [...S.history].reverse().forEach(h=>{
    h.drivers.forEach(d=>{
      S.counts[d]=(S.counts[d]||0)+1;
      if(h.date.slice(0,7)===CURRENT_MONTH){
        S.monthCounts[d]=(S.monthCounts[d]||0)+1;
      }
      if(!S.lastDate[d]||h.date>S.lastDate[d])S.lastDate[d]=h.date;
    });
  });
}

// ============================================================
// BACKEND
// ============================================================
function setSyncDot(s){document.getElementById('sync-dot').className='sync-dot '+s}

async function loadData(){
  setSyncDot('syncing');
  try{
    const res=await fetch(BACKEND+'?action=read');
    const data=await res.json();
    if(data&&data.history&&data.history.length>0){
      S.history=data.history;
      customSched=data.customSched||{};
      rebuildCounts();
      setSyncDot('ok');
    }else{
      S.history=[...HISTORICAL];
      customSched={};
      rebuildCounts();
      setSyncDot('ok');
    }
  }catch(e){
    S.history=[...HISTORICAL];
    customSched={};
    rebuildCounts();
    setSyncDot('error');
  }
  render();
}

async function saveData(){
  setSyncDot('syncing');
  try{
    await fetch(BACKEND,{method:'POST',body:JSON.stringify({action:'write',payload:{history:S.history,customSched}})});
    setSyncDot('ok');
  }catch(e){setSyncDot('error')}
}

async function archiveEntry(entry){
  try{
    await fetch(BACKEND,{method:'POST',body:JSON.stringify({action:'archive',entry:entry})});
  }catch(e){/* silent */}
}

// ============================================================
// SCHEDULE EDITOR
// ============================================================
let schedEdits={}; // working copy during edit

function renderSchedEditor(){
  const now=new Date();
  const year=now.getFullYear(), month=now.getMonth()+1;
  const daysInMonth=new Date(year,month,0).getDate();

  // Αρχικοποίησε working copy από customSched ή builtin
  schedEdits={};
  DRIVERS.forEach(dr=>{
    const custom=((customSched[year]||{})[month]||{})[dr];
    if(custom){
      schedEdits[dr]={repos:[...custom.repos],adeia:[...(custom.adeia||[])]};
    } else {
      // Από builtin (Μάιος 2026)
      if(month===5&&year===2026&&MAY_SCHED[dr]){
        schedEdits[dr]={repos:[...MAY_SCHED[dr].repos],adeia:[...MAY_SCHED[dr].adeia]};
      } else {
        schedEdits[dr]={repos:[],adeia:[]};
      }
    }
  });

  let html='';
  DRIVERS.forEach(dr=>{
    html+=`<div class="sched-driver">
      <div class="sched-driver-name">${dr}</div>
      <div class="sched-days">`;
    for(let day=1;day<=daysInMonth;day++){
      const d=new Date(year,month-1,day);
      const isSun=d.getDay()===0;
      const isRepo=schedEdits[dr].repos.includes(day);
      const isAdeia=schedEdits[dr].adeia.includes(day);
      let cls='sched-day';
      if(isSun) cls+=' sun';
      else if(isAdeia) cls+=' adeia';
      else if(isRepo) cls+=' repo';
      else cls+=' working';
      if(isSun){
        html+=`<button class="${cls}" disabled>${day}</button>`;
      } else {
        html+=`<button class="${cls}" data-dr="${dr}" data-day="${day}">${day}</button>`;
      }
    }
    html+=`</div></div>`;
  });

  document.getElementById('sched-editor').innerHTML=html;

  // Event delegation για mobile touch
  document.getElementById('sched-editor').addEventListener('click', function(e){
    const btn=e.target.closest('.sched-day:not([disabled])');
    if(!btn) return;
    const dr=btn.dataset.dr;
    const day=parseInt(btn.dataset.day);
    if(dr&&day) toggleSchedDay(dr,day);
  });
}

function toggleSchedDay(dr, day){
  const s=schedEdits[dr];
  if(s.repos.includes(day)){
    // Ρεπό → Άδεια
    s.repos=s.repos.filter(d=>d!==day);
    s.adeia.push(day);
  } else if(s.adeia.includes(day)){
    // Άδεια → Εργασία
    s.adeia=s.adeia.filter(d=>d!==day);
  } else {
    // Εργασία → Ρεπό
    s.repos.push(day);
  }
  renderSchedEditor();
}

async function saveSchedule(){
  const now=new Date();
  const year=now.getFullYear(), month=now.getMonth()+1;
  const daysInMonth=new Date(year,month,0).getDate();

  // Validation: έλεγξε κάθε εργάσιμη μέρα
  const errors=[];
  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(year,month-1,day);
    if(d.getDay()===0) continue; // Κυριακή — skip
    const reposToday=DRIVERS.filter(dr=>schedEdits[dr].repos.includes(day));
    const adeiaToday=DRIVERS.filter(dr=>schedEdits[dr].adeia.includes(day));
    const offToday=reposToday.length+adeiaToday.length;
    const workingToday=DRIVERS.length-offToday;
    if(reposToday.length>1){
      errors.push(`${day}/${month}: Περισσότεροι από 1 σε ρεπό (${reposToday.join(', ')})`);
    }
    if(workingToday<4&&adeiaToday.length===0){
      errors.push(`${day}/${month}: Εργάζονται μόνο ${workingToday} οδηγοί`);
    }
    if(workingToday<3){
      errors.push(`${day}/${month}: Πολύ λίγοι οδηγοί (${workingToday})`);
    }
  }

  if(errors.length>0){
    const msg='⚠️ Βρέθηκαν προβλήματα:\n\n'+errors.slice(0,5).join('\n')+(errors.length>5?`\n...και ${errors.length-5} ακόμα`:'');
    if(!confirm(msg+'\n\nΘέλεις να αποθηκεύσεις παρ\' όλα αυτά;')) return;
  }

  if(!customSched[year]) customSched[year]={};
  if(!customSched[year][month]) customSched[year][month]={};
  DRIVERS.forEach(dr=>{
    customSched[year][month][dr]={
      repos:schedEdits[dr].repos,
      adeia:schedEdits[dr].adeia
    };
  });
  await saveData();
  render();
  const btn=document.querySelector('.sched-save-btn');
  if(btn){btn.innerHTML='✓ Αποθηκεύτηκε!';setTimeout(()=>{btn.innerHTML='<i class="ti ti-device-floppy"></i> Αποθήκευση αλλαγών';},1500);}
}

// ============================================================
// RENDER
// ============================================================
function render(){
  dayOpts=getDayOpts();
  renderDayBtns();
  renderDriverChips();
  renderActionCard();
  if(document.getElementById('page-stats').classList.contains('active'))renderStats();
  if(document.getElementById('page-history').classList.contains('active'))renderHistory();
}

function renderDayBtns(){
  const el=document.getElementById('day-btns');
  const labels=['Σήμερα','Αύριο','Μεθαύριο'];
  el.innerHTML=dayOpts.map((opt,i)=>{
    const d=parseDate(opt.dateStr);
    const active=S.selOffset===opt.offset;
    return `<div class="day-btn${active?' active':''}" onclick="selDay(${opt.offset})">
      <div class="day-btn-main">${labels[i]}</div>
      <div class="day-btn-sub">${WD[opt.weekday]} ${d.getDate()}/${d.getMonth()+1}</div>
    </div>`;
  }).join('');
}

function renderDriverChips(){
  const opt=dayOpts.find(o=>o.offset===S.selOffset);
  if(!opt){document.getElementById('driver-chips').innerHTML='';return}
  const st=opt.status;
  let html='';
  DRIVERS.forEach(d=>{
    const cnt=S.monthCounts[d]||0;
    if(st.sunday.length)html+=`<span class="chip chip-sun">${d} ${cnt}</span>`;
    else if(st.holiday.length)html+=`<span class="chip chip-holiday">${d} ${cnt}</span>`;
    else if(st.adeia.includes(d))html+=`<span class="chip chip-adeia">${d} ${cnt}</span>`;
    else if(st.repos.includes(d))html+=`<span class="chip chip-off">${d} ${cnt}</span>`;
    else html+=`<span class="chip chip-work">${d} ${cnt}</span>`;
  });
  document.getElementById('driver-chips').innerHTML=html;
}

function renderActionCard(){
  const opt=dayOpts.find(o=>o.offset===S.selOffset);
  const el=document.getElementById('action-card');
  if(!opt){el.innerHTML='';return}
  const st=opt.status;
  const ds=opt.dateStr;
  const d=parseDate(ds);
  const dateLabel=`${WD[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;

  if(st.sunday.length||st.holiday.length){
    const type=st.sunday.length?'sun':'hol';
    const msg=st.sunday.length?'Κυριακή — δεν εργάζεται κανείς.':'Αργία — δεν εργάζεται κανείς.';
    el.innerHTML=`<div class="msg msg-${type}">${msg}</div>`;
    return;
  }

  const entry=getEntry(ds);
  const working=st.working;

  let html=`<div class="card ${entry?'send-card':''}">
    <div class="label"><i class="ti ti-building-factory"></i> Inter — ${dateLabel}</div>`;

  if(entry){
    // Υπάρχει ήδη καταχωρημένη εγγραφή
    html+=`<div class="suggested-names">`;
    entry.drivers.forEach((d,i)=>{
      const cnt=S.monthCounts[d]||0;
      const last=S.lastDate[d];
      const dayAgo=last?daysSince(last):null;
      const metaTxt=dayAgo!==null?`${cnt}x · τελ. ${dayAgo}μ πριν`:`${cnt}x`;
      if(S.editIdx===i){
        const available=working.filter(w=>w===d||!entry.drivers.includes(w));
        html+=`<div class="sent-row">
          <select class="inline-sel" id="edit-sel" onchange="S.editVal=this.value">
            ${available.map(w=>`<option value="${w}"${w===d?' selected':''}>${w} (${S.monthCounts[w]||0}x)</option>`).join('')}
          </select>
          <button class="ok-btn" onclick="confirmEdit(${i})">OK</button>
        </div>`;
      }else{
        html+=`<div class="sent-row">
          <span class="sent-name">${d}</span>
          <span class="sent-meta">${metaTxt}</span>
          <span class="sent-actions">
            <button class="ic-btn edit" onclick="startEdit(${i},'${d}')" title="Αλλαγή"><i class="ti ti-pencil"></i></button>
            <button class="ic-btn del" onclick="removeDriver(${i})" title="Αφαίρεση"><i class="ti ti-x"></i></button>
          </span>
        </div>`;
      }
    });
    html+=`</div>`;
    // Προσθήκη +1
    if(entry.drivers.length<working.length){
      html+=`<button class="send-btn has-entry" onclick="addOneMore('${ds}')"><i class="ti ti-plus"></i> Προσθήκη οδηγού</button>`;
    }
  }else{
    // Νέα εγγραφή
    html+=`<div class="count-row">
      <button class="cnt-btn" onclick="changeCount(-1)">−</button>
      <div class="cnt-num" id="cnt-num">${S.currentCount}</div>
      <span class="cnt-label">οδηγοί</span>
      <button class="cnt-btn" onclick="changeCount(1)">+</button>
    </div>`;
    if(S.currentCount>0){
      const suggested=getSorted(working,ds).slice(0,Math.min(S.currentCount,working.length));
      html+=`<div class="suggested-names">`;
      suggested.forEach(dr=>{
        const cnt=S.monthCounts[dr]||0;
        html+=`<div class="sent-row"><span class="sent-name">${dr}</span><span class="sent-meta">${cnt}x</span></div>`;
      });
      html+=`</div>`;
      html+=`<button class="send-btn" onclick="doSend('${ds}')"><i class="ti ti-send"></i> Αποστολή για ${d.getDate()}/${d.getMonth()+1}</button>`;
    }else{
      html+=`<button class="send-btn" style="background:#888;border-color:#888" onclick="doSend('${ds}')">Καταχώρηση — κανένας στην Inter</button>`;
    }
  }

  html+=`</div>`;
  el.innerHTML=html;
}

function renderStats(){
  const maxC=Math.max(...DRIVERS.map(d=>S.monthCounts[d]||0),1);
  const sorted=getSorted(DRIVERS,null);
  const html=sorted.map((d,i)=>{
    const cnt=S.monthCounts[d]||0;
    const last=S.lastDate[d];
    const lastTxt=last?`τελ. ${daysSince(last)} μέρες πριν`:'δεν έχει πάει';
    const pct=Math.round((cnt/maxC)*100);
    return `<div class="stat-row">
      <div class="stat-top">
        <span class="stat-name">${i===0?`<span class="next-badge">επόμενος</span> `:''}${d}</span>
        <span class="stat-cnt">${cnt}x</span>
      </div>
      <div class="stat-last">${lastTxt}</div>
      <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  document.getElementById('stats-list').innerHTML=html||'<div class="empty">Δεν υπάρχουν δεδομένα</div>';
}

function renderHistory(){
  // Εμφάνιση μόνο τελευταίων 2 μηνών
  const now=new Date();
  const thisMonth=now.toISOString().slice(0,7);
  const prevMonth=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,7);
  const filtered=S.history.filter(h=>h.date.slice(0,7)===thisMonth||h.date.slice(0,7)===prevMonth);
  if(!filtered.length){document.getElementById('history-list').innerHTML='<div class="empty">Δεν υπάρχει ιστορικό</div>';return}
  // Νεότερο πρώτο
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('history-list').innerHTML=sorted.map(h=>`
    <div class="hist-row">
      <span class="hist-date">${fmtDate(h.date)}</span>
      <span class="hist-names">${h.drivers.join(', ')}</span>
    </div>`).join('');
}

// ============================================================
// ACTIONS
// ============================================================
function selDay(offset){
  S.selOffset=offset;S.editIdx=-1;
  renderDayBtns();renderDriverChips();renderActionCard();
}

function changeCount(delta){
  const opt=dayOpts.find(o=>o.offset===S.selOffset);
  const max=opt?opt.status.working.length:4;
  S.currentCount=Math.max(0,Math.min(S.currentCount+delta,max));
  renderActionCard();
}

function doSend(ds){
  const opt=dayOpts.find(o=>o.dateStr===ds);
  if(!opt)return;
  const working=opt.status.working;
  const suggested=S.currentCount===0?[]:getSorted(working,ds).slice(0,Math.min(S.currentCount,working.length));
  S.history=S.history.filter(h=>h.date!==ds);
  const entry={date:ds,drivers:suggested};
  S.history.unshift(entry);
  S.history=S.history.slice(0,90);
  rebuildCounts();
  saveData();
  archiveEntry(entry);
  render();
}

function addOneMore(ds){
  const entry=getEntry(ds);
  const opt=dayOpts.find(o=>o.dateStr===ds);
  if(!entry||!opt)return;
  const working=opt.status.working;
  const available=working.filter(w=>!entry.drivers.includes(w));
  if(!available.length)return;
  const next=getSorted(available,ds)[0];
  entry.drivers.push(next);
  rebuildCounts();
  saveData();
  render();
}

function startEdit(i,name){
  S.editIdx=i;S.editVal=name;
  renderActionCard();
}

function confirmEdit(i){
  const opt=dayOpts.find(o=>o.offset===S.selOffset);
  if(!opt)return;
  const entry=getEntry(opt.dateStr);
  if(!entry)return;
  const sel=document.getElementById('edit-sel');
  const newName=sel?sel.value:S.editVal;
  entry.drivers[i]=newName;
  S.editIdx=-1;
  rebuildCounts();
  saveData();
  render();
}

function removeDriver(i){
  const opt=dayOpts.find(o=>o.offset===S.selOffset);
  if(!opt)return;
  const entry=getEntry(opt.dateStr);
  if(!entry)return;
  if(entry.drivers.length<=1){
    S.history=S.history.filter(h=>h.date!==opt.dateStr);
  }else{
    entry.drivers.splice(i,1);
  }
  S.editIdx=-1;
  rebuildCounts();
  saveData();
  render();
}

// ============================================================
// NAV
// ============================================================
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const idx=['main','stats','history','schedule'].indexOf(name);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  if(name==='stats')renderStats();
  if(name==='history')renderHistory();
  if(name==='schedule')renderSchedEditor();
}

// ============================================================
// INIT
// ============================================================
const now=new Date();
document.getElementById('hdr-date').textContent=WD[now.getDay()]+' '+now.getDate()+'/'+(now.getMonth()+1);
loadData();
</script>
